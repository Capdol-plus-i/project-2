; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; [env:uno]
; platform = atmelavr
; board = uno
; framework = arduino
; upload_port  = /dev/arduino
; monitor_port = /dev/arduino
; monitor_speed = 9600

[env]
platform = atmelavr
framework = arduino
lib_deps =
  TaskScheduler
  nicohood/PinChangeInterrupt @ ^1.2.9
  adafruit/Adafruit NeoPixel @ ^1.15.2
  adafruit/Adafruit MPU6050 @ ^2.2.6
  adafruit/Adafruit Unified Sensor @ ^1.1.15
  adafruit/Adafruit BusIO @ ^1.17.4

[env:left]                  ; 보드 #1       ; 예: AVR 계열 (UNO/Nano 등)
board = megaatmega2560                 ; 보드에 맞게 (예: uno, nanoatmega328new 등)
framework = arduino
upload_port = /dev/ttyACM1  ; Windows면 COM3 처럼
monitor_port = /dev/ttyACM1
src_filter = +<left/> -<right/>   ; left만 컴파일
upload_speed = 57600

[env:right]                 ; 보드 #2
board = uno
framework = arduino
upload_port = /dev/arduino
monitor_port = /dev/arduino
src_filter = +<right/> -<left/>   ; right만 컴파일