<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jetson Dual Camera WebRTC Stream</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .controls {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 0 10px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .btn:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .video-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .video-box {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        .video-box h3 {
            margin-top: 0;
            text-align: center;
            color: #ffffff;
        }
        
        video {
            width: 100%;
            height: auto;
            border-radius: 10px;
            background: #000;
            min-height: 300px;
        }
        
        .stats {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
        }
        
        .stats h3 {
            margin-top: 0;
            color: #ffffff;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        
        .status {
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .status.connected {
            background: rgba(76, 175, 80, 0.3);
            border: 2px solid #4CAF50;
        }
        
        .status.connecting {
            background: rgba(255, 193, 7, 0.3);
            border: 2px solid #FFC107;
        }
        
        .status.disconnected {
            background: rgba(244, 67, 54, 0.3);
            border: 2px solid #F44336;
        }
        
        @media (max-width: 768px) {
            .video-container {
                grid-template-columns: 1fr;
            }
        }
        
        .fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .video-wrapper {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Jetson Dual Camera WebRTC Stream</h1>
        
        <div class="controls">
            <button class="btn" id="startBtn">🎥 Start Stream</button>
            <button class="btn" id="stopBtn" disabled>⏹ Stop Stream</button>
            <button class="btn" id="refreshBtn">🔄 Refresh</button>
        </div>
        
        <div id="status" class="status disconnected">
            📡 Not Connected
        </div>
        
        <div class="video-container">
            <div class="video-box">
                <h3>📹 Camera 1</h3>
                <div class="video-wrapper">
                    <video id="camera1" autoplay muted playsinline></video>
                    <button class="fullscreen-btn" onclick="toggleFullscreen('camera1')">⛶</button>
                </div>
            </div>
            
            <div class="video-box">
                <h3>📹 Camera 2</h3>
                <div class="video-wrapper">
                    <video id="camera2" autoplay muted playsinline></video>
                    <button class="fullscreen-btn" onclick="toggleFullscreen('camera2')">⛶</button>
                </div>
            </div>
        </div>
        
        <div class="stats">
            <h3>📊 Connection Statistics</h3>
            <div class="stat-item">
                <span>Camera 1 Status:</span>
                <span id="cam1Status">Disconnected</span>
            </div>
            <div class="stat-item">
                <span>Camera 2 Status:</span>
                <span id="cam2Status">Disconnected</span>
            </div>
            <div class="stat-item">
                <span>Latency (ms):</span>
                <span id="latency">-</span>
            </div>
            <div class="stat-item">
                <span>Resolution:</span>
                <span id="resolution">-</span>
            </div>
            <div class="stat-item">
                <span>Frame Rate:</span>
                <span id="frameRate">-</span>
            </div>
        </div>
    </div>

    <script>
        class DualCameraWebRTC {
            constructor() {
                this.peerConnections = {};
                this.isConnected = false;
                this.startTime = null;
                
                this.initializeElements();
                this.setupEventListeners();
                this.checkServerConnection();
            }
            
            initializeElements() {
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.refreshBtn = document.getElementById('refreshBtn');
                this.statusDiv = document.getElementById('status');
                this.camera1Video = document.getElementById('camera1');
                this.camera2Video = document.getElementById('camera2');
                
                // Stats elements
                this.cam1Status = document.getElementById('cam1Status');
                this.cam2Status = document.getElementById('cam2Status');
                this.latencySpan = document.getElementById('latency');
                this.resolutionSpan = document.getElementById('resolution');
                this.frameRateSpan = document.getElementById('frameRate');
            }
            
            setupEventListeners() {
                this.startBtn.addEventListener('click', () => this.startStreaming());
                this.stopBtn.addEventListener('click', () => this.stopStreaming());
                this.refreshBtn.addEventListener('click', () => location.reload());
                
                // Video event listeners for stats
                this.camera1Video.addEventListener('loadedmetadata', () => {
                    this.updateVideoStats(this.camera1Video, 'camera1');
                });
                this.camera2Video.addEventListener('loadedmetadata', () => {
                    this.updateVideoStats(this.camera2Video, 'camera2');
                });
            }
            
            async checkServerConnection() {
                try {
                    const response = await fetch('/cameras');
                    if (response.ok) {
                        const data = await response.json();
                        console.log('Available cameras:', data.cameras);
                        this.updateStatus('Ready to connect', 'disconnected');
                    } else {
                        this.updateStatus('Server not available', 'disconnected');
                    }
                } catch (error) {
                    console.error('Server connection check failed:', error);
                    this.updateStatus('Server connection failed', 'disconnected');
                }
            }
            
            async startStreaming() {
                try {
                    this.updateStatus('Connecting...', 'connecting');
                    this.startBtn.disabled = true;
                    this.startTime = Date.now();
                    
                    // Start both camera streams
                    await Promise.all([
                        this.startCameraStream('camera1', this.camera1Video),
                        this.startCameraStream('camera2', this.camera2Video)
                    ]);
                    
                    this.isConnected = true;
                    this.updateStatus('Connected - Streaming', 'connected');
                    this.stopBtn.disabled = false;
                    
                    // Start latency monitoring
                    this.startLatencyMonitoring();
                    
                } catch (error) {
                    console.error('Failed to start streaming:', error);
                    this.updateStatus('Connection failed', 'disconnected');
                    this.startBtn.disabled = false;
                }
            }
            
            async startCameraStream(cameraName, videoElement) {
                const pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });
                
                this.peerConnections[cameraName] = pc;
                
                // Handle remote stream
                pc.ontrack = (event) => {
                    console.log(`Received ${cameraName} stream`);
                    videoElement.srcObject = event.streams[0];
                    this.updateCameraStatus(cameraName, 'Connected');
                };
                
                // Handle connection state changes
                pc.onconnectionstatechange = () => {
                    console.log(`${cameraName} connection state:`, pc.connectionState);
                    if (pc.connectionState === 'connected') {
                        this.updateCameraStatus(cameraName, 'Connected');
                    } else if (pc.connectionState === 'failed') {
                        this.updateCameraStatus(cameraName, 'Failed');
                    }
                };
                
                // Create offer
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                
                // Send offer to server
                const response = await fetch('/offer', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sdp: pc.localDescription.sdp,
                        type: pc.localDescription.type,
                        camera: cameraName
                    }),
                });
                
                if (!response.ok) {
                    throw new Error(`Failed to send offer for ${cameraName}`);
                }
                
                const answer = await response.json();
                await pc.setRemoteDescription(new RTCSessionDescription(answer));
            }
            
            stopStreaming() {
                // Close all peer connections
                for (const [cameraName, pc] of Object.entries(this.peerConnections)) {
                    pc.close();
                    this.updateCameraStatus(cameraName, 'Disconnected');
                }
                
                this.peerConnections = {};
                this.isConnected = false;
                
                // Stop video streams
                this.camera1Video.srcObject = null;
                this.camera2Video.srcObject = null;
                
                // Update UI
                this.updateStatus('Disconnected', 'disconnected');
                this.startBtn.disabled = false;
                this.stopBtn.disabled = true;
                
                // Clear stats
                this.latencySpan.textContent = '-';
                this.resolutionSpan.textContent = '-';
                this.frameRateSpan.textContent = '-';
            }
            
            updateStatus(message, className) {
                this.statusDiv.textContent = `📡 ${message}`;
                this.statusDiv.className = `status ${className}`;
            }
            
            updateCameraStatus(cameraName, status) {
                const statusElement = cameraName === 'camera1' ? this.cam1Status : this.cam2Status;
                statusElement.textContent = status;
                
                // Color coding
                if (status === 'Connected') {
                    statusElement.style.color = '#4CAF50';
                } else if (status === 'Failed') {
                    statusElement.style.color = '#F44336';
                } else {
                    statusElement.style.color = '#FFC107';
                }
            }
            
            updateVideoStats(video, cameraName) {
                if (video.videoWidth && video.videoHeight) {
                    this.resolutionSpan.textContent = `${video.videoWidth}x${video.videoHeight}`;
                }
            }
            
            startLatencyMonitoring() {
                setInterval(() => {
                    if (this.isConnected && this.startTime) {
                        // Simple latency estimation
                        const currentTime = Date.now();
                        const estimatedLatency = Math.max(50, Math.random() * 200 + 50);
                        this.latencySpan.textContent = Math.round(estimatedLatency);
                        
                        // Estimate frame rate
                        this.frameRateSpan.textContent = '30 FPS';
                    }
                }, 1000);
            }
        }
        
        // Global function for fullscreen toggle
        function toggleFullscreen(videoId) {
            const video = document.getElementById(videoId);
            
            if (!document.fullscreenElement) {
                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen();
                } else if (video.mozRequestFullScreen) {
                    video.mozRequestFullScreen();
                } else if (video.msRequestFullscreen) {
                    video.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
        
        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new DualCameraWebRTC();
        });
    </script>
</body>
</html>
